[package]
name = "deskdsp-control"
version = "0.1.0"
edition = "2021"
description = "DeskDSP Control: Unified custom DSP suite and hardware control for Antelope Audio Zen Go Synergy Core"

[dependencies]
antelope-protocol = { path = "crates/antelope-protocol" }
hidapi = "2.6"
cpal = "0.15"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rtrb = "0.4"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
realfft = "3.5.0"
rustfft = "6.4.1"
midir = "0.9"
[target.'cfg(target_os = "linux")'.dependencies]
livi = { version = "0.7", optional = true }

[features]
default = []
lv2-host = ["dep:livi"]

[dev-dependencies]
approx = "0.5"
assert_no_alloc = "1.1"
