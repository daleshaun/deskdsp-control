[package]
name = "deskdsp-control"
version = "0.1.0"
edition = "2021"
description = "DeskDSP Control: Unified custom DSP suite and hardware control for Antelope Audio Zen Go Synergy Core"

[dependencies]
antelope-protocol = { path = "crates/antelope-protocol" }
hidapi = "2.6"
cpal = "0.15"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
approx = "0.5"
