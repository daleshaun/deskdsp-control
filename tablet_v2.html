<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>THE DESK — Zen Go Control</title>
<style>
  :root{
    --body:#262429;--panel:#322f37;--panel2:#3a3942;--edge:#4a4852;--edge2:#2a2930;
    --cream:#e7e0cf;--ink:#2a251d;--muted:#8f8d86;
    --red:#b1473d;--amber:#e0a94b;--grn:#4f9d68;--grn2:#3f8f5f;--blue:#5b8ab0;
  }
  *{box-sizing:border-box;margin:0;font-family:"Helvetica Neue",Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  html,body{height:100%}
  body{background:
    radial-gradient(120% 90% at 50% -10%, #34323a 0%, #1a191e 70%, #111014 100%);
    padding:12px;display:flex;align-items:center;justify-content:center;color:var(--cream)}
  #desk{width:100%;max-width:1180px;border-radius:16px;padding:14px;position:relative;
    background:linear-gradient(176deg,#4a4852 0%,#343139 44%,#201e24 100%);
    border:1px solid #55535d;
    box-shadow:0 22px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06), inset 0 -3px 10px rgba(0,0,0,.5)}
  #desk:before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,rgba(0,0,0,.012) 2px 4px)}
  .screw{position:absolute;width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#8a8a84,#2b2b28);box-shadow:inset 0 0 2px #000}
  .s1{top:10px;left:10px}.s2{top:10px;right:10px}.s3{bottom:10px;left:10px}.s4{bottom:10px;right:10px}
  /* header */
  .top{display:flex;justify-content:space-between;align-items:center;padding:2px 8px 12px}
  .brand{font-weight:800;letter-spacing:3px;font-size:20px}
  .brand span{color:var(--amber)}
  .brand small{color:var(--muted);font-weight:700;letter-spacing:3px;font-size:9px;margin-left:10px}
  .conn{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1px;
    padding:6px 12px;border-radius:20px;background:#1b1a1f;border:1px solid #000}
  .conn .dot{width:9px;height:9px;border-radius:50%}
  .conn.ok{color:var(--grn)} .conn.ok .dot{background:var(--grn);box-shadow:0 0 7px var(--grn)}
  .conn.off{color:var(--red)} .conn.off .dot{background:var(--red);box-shadow:0 0 7px var(--red)}
  /* grid */
  .bay{display:flex;gap:12px;align-items:stretch}
  .panel{background:linear-gradient(180deg,#3a3942,#2b2a31);border:1px solid var(--edge);
    border-radius:11px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 4px 12px rgba(0,0,0,.35)}
  .lbl{background:linear-gradient(180deg,#efe9da,#d9d2c0);color:var(--ink);font-weight:800;
    letter-spacing:1.5px;font-size:11px;padding:6px 12px;display:flex;justify-content:space-between;align-items:center}
  .lbl .tiny{font-size:8.5px;color:#6a6456;letter-spacing:1px}
  /* meter bridge */
  .bridge{width:300px;flex:0 0 auto}
  .bridge .in{padding:12px 12px 14px}
  .mrow{display:flex;gap:10px;justify-content:center;align-items:flex-end}
  .mcol{display:flex;flex-direction:column;align-items:center;gap:5px}
  .meter{width:30px;height:188px;background:#0c0b0e;border:1px solid #000;border-radius:4px;
    padding:3px;display:flex;flex-direction:column-reverse;gap:2px;box-shadow:inset 0 0 8px #000}
  .seg{flex:1;border-radius:1.5px;background:#1b1b20;transition:background .05s linear}
  .mlab{font-size:9px;font-weight:800;color:var(--cream);letter-spacing:1px}
  .mdb{font-size:8.5px;color:var(--amber);font-weight:700}
  .grwrap{margin-top:12px}
  .grbar{height:9px;background:#0c0b0e;border:1px solid #000;border-radius:4px;overflow:hidden}
  .grbar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--amber),var(--red));transition:width .07s linear}
  .grmini{display:flex;justify-content:space-between;font-size:8.5px;color:var(--muted);font-weight:700;margin:4px 0 8px}
  .grmini b{color:var(--cream)}
  /* channel */
  .chan{flex:1;min-width:0}
  .chan .in{padding:12px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .knob{width:118px;height:118px;position:relative}
  .gv{color:var(--amber);font-weight:800;font-size:21px;line-height:1}
  .gt{color:var(--muted);font-size:9px;letter-spacing:2px;font-weight:700}
  .btns{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .bg{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--cream);background:#1c1b20;
    border:1px solid #55535c;border-radius:7px;padding:10px 14px;min-width:56px;text-align:center;
    box-shadow:inset 0 1px 1px rgba(0,0,0,.5)}
  .bg.on{color:#fff;background:var(--red);border-color:#7f3029;box-shadow:0 0 9px rgba(177,71,61,.5)}
  .bg.amb.on{background:var(--amber);color:#2c2510;border-color:#8a6420;box-shadow:0 0 9px rgba(224,169,75,.5)}
  .inled{width:100%;height:11px;background:#0c0b0e;border:1px solid #000;border-radius:3px;overflow:hidden}
  .inled>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--grn),var(--amber) 78%,var(--red));transition:width .07s linear}
  /* monitor */
  .mon{width:290px;flex:0 0 auto}
  .fds{display:flex;justify-content:space-around;padding:12px 8px 14px;gap:4px}
  .fd{display:flex;flex-direction:column;align-items:center;gap:8px}
  .fader{width:50px;height:196px;background:linear-gradient(90deg,#1a191e,#2a2930);border:1px solid #000;
    border-radius:6px;position:relative;box-shadow:inset 0 0 8px #000}
  .fader .trk{position:absolute;left:50%;top:12px;bottom:12px;width:6px;transform:translateX(-50%);
    background:#0a0a0c;border-radius:3px;box-shadow:inset 0 0 3px #000}
  .fader .cap{position:absolute;left:5px;right:5px;height:30px;border-radius:5px;
    background:linear-gradient(#45444c,#1b1b1f);border:1px solid #000;box-shadow:0 3px 7px rgba(0,0,0,.6)}
  .fader .cap:after{content:"";position:absolute;left:5px;right:5px;top:50%;height:3px;
    background:var(--amber);transform:translateY(-50%);border-radius:2px;box-shadow:0 0 5px rgba(224,169,75,.6)}
  .fl{font-size:10px;font-weight:800;letter-spacing:1px}
  .fv{font-size:11px;color:var(--amber);font-weight:700}
  svg{display:block}
</style>
</head>
<body>
<div id="desk">
  <div class="screw s1"></div><div class="screw s2"></div><div class="screw s3"></div><div class="screw s4"></div>
  <div class="top">
    <div class="brand">THE <span>DESK</span><small>ZEN GO · CONTROL</small></div>
    <div class="conn off" id="conn"><span class="dot"></span><span id="connTxt">OFFLINE</span></div>
  </div>

  <div class="bay">
    <!-- LIVE AUDIO METER BRIDGE -->
    <div class="panel bridge">
      <div class="lbl"><span>PROGRAM · LIVE</span><span class="tiny" id="srTag">—</span></div>
      <div class="in">
        <div class="mrow">
          <div class="mcol"><div class="meter" data-m="inL"></div><div class="mlab">IN L</div><div class="mdb" data-db="inL">−∞</div></div>
          <div class="mcol"><div class="meter" data-m="inR"></div><div class="mlab">IN R</div><div class="mdb" data-db="inR">−∞</div></div>
          <div class="mcol"><div class="meter" data-m="outL"></div><div class="mlab">OUT L</div><div class="mdb" data-db="outL">−∞</div></div>
          <div class="mcol"><div class="meter" data-m="outR"></div><div class="mlab">OUT R</div><div class="mdb" data-db="outR">−∞</div></div>
        </div>
        <div class="grwrap">
          <div class="grmini"><span>COMP GR</span><b data-gr="comp">0.0 dB</b></div>
          <div class="grbar"><i data-grbar="comp"></i></div>
          <div class="grmini" style="margin-top:8px"><span>LIMITER GR</span><b data-gr="lim">0.0 dB</b></div>
          <div class="grbar"><i data-grbar="lim"></i></div>
        </div>
      </div>
    </div>

    <!-- CHANNEL 1 -->
    <div class="panel chan" data-ch="1">
      <div class="lbl"><span>CH 1 · VOX</span><span class="tiny modeTag">—</span></div>
      <div class="in">
        <div class="knob" data-knob="1"></div>
        <div class="gv" data-val="1">—</div><div class="gt">PREAMP GAIN</div>
        <div class="btns modeBtns">
          <span class="bg" data-mode="mic">MIC</span><span class="bg" data-mode="line">LINE</span><span class="bg" data-mode="hiz">HI-Z</span>
        </div>
        <div class="btns">
          <span class="bg amb" data-tog="48v">+48V</span><span class="bg" data-tog="phase">Ø</span>
        </div>
        <div class="inled"><i data-meter="1"></i></div>
      </div>
    </div>

    <!-- CHANNEL 2 -->
    <div class="panel chan" data-ch="2">
      <div class="lbl"><span>CH 2 · GTR</span><span class="tiny modeTag">—</span></div>
      <div class="in">
        <div class="knob" data-knob="2"></div>
        <div class="gv" data-val="2">—</div><div class="gt">PREAMP GAIN</div>
        <div class="btns modeBtns">
          <span class="bg" data-mode="mic">MIC</span><span class="bg" data-mode="line">LINE</span><span class="bg" data-mode="hiz">HI-Z</span>
        </div>
        <div class="btns">
          <span class="bg amb" data-tog="48v">+48V</span><span class="bg" data-tog="phase">Ø</span>
        </div>
        <div class="inled"><i data-meter="2"></i></div>
      </div>
    </div>

    <!-- MONITOR -->
    <div class="panel mon">
      <div class="lbl"><span>MONITOR</span><span class="tiny" id="muteTag">—</span></div>
      <div class="fds">
        <div class="fd"><div class="fader" data-fader="mon"><div class="trk"></div><div class="cap"></div></div><div class="fl">MON</div><div class="fv" data-fv="mon">—</div></div>
        <div class="fd"><div class="fader" data-fader="hp1"><div class="trk"></div><div class="cap"></div></div><div class="fl">HP 1</div><div class="fv" data-fv="hp1">—</div></div>
        <div class="fd"><div class="fader" data-fader="hp2"><div class="trk"></div><div class="cap"></div></div><div class="fl">HP 2</div><div class="fv" data-fv="hp2">—</div></div>
      </div>
      <div style="display:flex;justify-content:center;padding:0 0 14px"><span class="bg" data-tog="mute" style="min-width:110px">DIM / MUTE</span></div>
    </div>
  </div>
</div>

<script>
"use strict";
const NS="http://www.w3.org/2000/svg";
const el=(n,a={})=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const P=(cx,cy,r,a)=>[cx+r*Math.sin(a*Math.PI/180),cy-r*Math.cos(a*Math.PI/180)];
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

const GAIN_RANGE={mic:[0,65],line:[-6,20],hiz:[0,45]};
function gainToRaw(mode,db){ if(mode==="line"){let v=Math.round(db);if(v<0)v+=256;return clamp(v,0,255);} return clamp(Math.round(db),0,255); }
function modeKey(s){ return (s||"").toLowerCase().replace("hi-z","hiz"); }

// ---- WebSocket ----
const token=new URLSearchParams(location.search).get("token");
let ws=null, wsOpen=false;
function wsSend(obj){ if(wsOpen){ try{ws.send(JSON.stringify(obj));}catch(e){} } }
function connect(){
  const proto=location.protocol==="https:"?"wss":"ws";
  const url=`${proto}://${location.host}/ws`+(token?`?token=${encodeURIComponent(token)}`:"");
  ws=new WebSocket(url);
  ws.onopen=()=>{wsOpen=true;setConn(true);};
  ws.onclose=()=>{wsOpen=false;setConn(false);setTimeout(connect,1200);};
  ws.onerror=()=>{try{ws.close();}catch(e){}};
  ws.onmessage=(e)=>{try{onMsg(JSON.parse(e.data));}catch(err){}};
}

// ---- segmented meters ----
const SEGS=18;
function buildMeter(box){
  for(let i=0;i<SEGS;i++){ const s=document.createElement("div"); s.className="seg"; box.appendChild(s); }
}
document.querySelectorAll(".meter").forEach(buildMeter);
// dBFS (-60..0) -> lit segments, colored
function paintMeter(key,dbfs){
  const box=document.querySelector(`.meter[data-m="${key}"]`); if(!box) return;
  const norm=clamp((dbfs+60)/60,0,1);
  const lit=Math.round(norm*SEGS);
  const segs=box.children;
  for(let i=0;i<SEGS;i++){
    const on=i<lit;
    let col="#1b1b20";
    if(on){ const frac=i/SEGS; col = frac>0.92 ? "#e05a4a" : frac>0.8 ? "#e0a94b" : "#4f9d68"; }
    segs[i].style.background=on?col:"#1b1b20";
    segs[i].style.boxShadow=on?"0 0 4px "+col:"none";
  }
  const dbEl=document.querySelector(`.mdb[data-db="${key}"]`);
  if(dbEl) dbEl.textContent = dbfs<=-60 ? "−∞" : (dbfs>=0?"":"−")+Math.abs(dbfs).toFixed(0);
}
function paintGR(key,db){
  const b=document.querySelector(`[data-grbar="${key}"]`), t=document.querySelector(`[data-gr="${key}"]`);
  const amt=clamp(Math.abs(db),0,24);
  if(b) b.style.width=(amt/24*100)+"%";
  if(t) t.textContent=`${amt.toFixed(1)} dB`;
}

// ---- knobs ----
const ch={1:{mode:"mic",db:0,drag:false},2:{mode:"hiz",db:0,drag:false}};
const knobs={};
function buildKnob(c){
  const sz=118,cx=59,cy=59,A0=-140,A1=140;
  const s=el("svg",{width:"100%",height:"100%",viewBox:`0 0 ${sz} ${sz}`});
  s.appendChild(el("circle",{cx,cy,r:53,fill:"#17161a",stroke:"#4a4852","stroke-width":1.5}));
  for(let i=0;i<=10;i++){const a=A0+(A1-A0)*i/10;const[x1,y1]=P(cx,cy,55,a),[x2,y2]=P(cx,cy,60,a);
    s.appendChild(el("line",{x1,y1,x2,y2,stroke:"#7d7b74","stroke-width":2}));}
  s.appendChild(el("path",{d:`M${P(cx,cy,49,A0).join(" ")} A49 49 0 1 1 ${P(cx,cy,49,A1).join(" ")}`,fill:"none",stroke:"#3a3a35","stroke-width":5,"stroke-linecap":"round"}));
  const fill=el("path",{fill:"none",stroke:"#e0a94b","stroke-width":5,"stroke-linecap":"round"}); s.appendChild(fill);
  s.appendChild(el("circle",{cx,cy,r:38,fill:"#b1473d",stroke:"#0c0c0e","stroke-width":2}));
  s.appendChild(el("ellipse",{cx,cy:cy-12,rx:22,ry:13,fill:"rgba(255,255,255,.12)"}));
  const ind=el("line",{x1:cx,y1:cy,x2:cx,y2:cy-33,stroke:"#f2efe6","stroke-width":5,"stroke-linecap":"round"}); s.appendChild(ind);
  c.appendChild(s);
  return {fill,ind,cx,cy,A0,A1};
}
function setKnob(k,norm){
  const av=k.A0+(k.A1-k.A0)*norm;
  k.ind.setAttribute("transform",`rotate(${av} ${k.cx} ${k.cy})`);
  const large=(av-k.A0)>180?1:0;
  k.fill.setAttribute("d",`M${P(k.cx,k.cy,49,k.A0).join(" ")} A49 49 0 ${large} 1 ${P(k.cx,k.cy,49,av).join(" ")}`);
}
document.querySelectorAll("[data-knob]").forEach(c=>{
  const n=c.dataset.knob; knobs[n]=buildKnob(c);
  let startY=0,startDb=0;
  c.addEventListener("pointerdown",e=>{c.setPointerCapture(e.pointerId);ch[n].drag=true;startY=e.clientY;startDb=ch[n].db;e.preventDefault();});
  c.addEventListener("pointermove",e=>{
    if(!ch[n].drag)return;
    const[lo,hi]=GAIN_RANGE[ch[n].mode];
    const db=clamp(startDb+(startY-e.clientY)/200*(hi-lo),lo,hi);
    ch[n].db=db; renderGain(n);
    wsSend({type:"set_gain",input:(n-1),gain_db:gainToRaw(ch[n].mode,db)});
  });
  const end=()=>{ch[n].drag=false;};
  c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
});
function renderGain(n){
  const[lo,hi]=GAIN_RANGE[ch[n].mode]; const norm=clamp((ch[n].db-lo)/(hi-lo),0,1);
  setKnob(knobs[n],norm);
  const lab=ch[n].mode==="line"?`${ch[n].db>=0?"+":""}${Math.round(ch[n].db)} dB`:`${Math.round(ch[n].db)} dB`;
  document.querySelector(`[data-val="${n}"]`).textContent=lab;
}
function renderMode(n){
  const p=document.querySelector(`.chan[data-ch="${n}"]`);
  p.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("on",b.dataset.mode===ch[n].mode));
  p.querySelector(".modeTag").textContent=ch[n].mode==="hiz"?"HI-Z":ch[n].mode.toUpperCase();
}

// buttons
const MODE_WIRE={mic:"Mic",line:"Line",hiz:"HiZ"};
document.querySelectorAll(".chan").forEach(p=>{
  const n=p.dataset.ch;
  p.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{
    const m=b.dataset.mode; ch[n].mode=m;
    const[lo,hi]=GAIN_RANGE[m]; ch[n].db=clamp(ch[n].db,lo,hi);
    wsSend({type:"set_mode",input:(n-1),mode:MODE_WIRE[m]});
    renderMode(n); renderGain(n);
  }));
  p.querySelectorAll("[data-tog]").forEach(b=>b.addEventListener("click",()=>{
    const on=!b.classList.contains("on"); b.classList.toggle("on",on);
    if(b.dataset.tog==="48v") wsSend({type:"set_phantom",input:(n-1),enabled:on});
    else if(b.dataset.tog==="phase") wsSend({type:"set_phase",input:(n-1),enabled:on});
  }));
});

// faders
const FMAX=96;
const fader={mon:{step:0,drag:false},hp1:{step:0,drag:false},hp2:{step:0,drag:false}};
document.querySelectorAll("[data-fader]").forEach(f=>{
  const key=f.dataset.fader, cap=f.querySelector(".cap");
  const geo=()=>{const h=f.clientHeight,ch2=cap.clientHeight,pad=10;return{min:pad,max:h-ch2-pad};};
  f._place=(step)=>{const{min,max}=geo();const norm=1-step/FMAX;cap.style.top=(min+(1-norm)*(max-min))+"px";
    const fv=document.querySelector(`[data-fv="${key}"]`); if(fv)fv.textContent=step===0?"0":`−${step}`;};
  let drag=false;
  const fromY=(cy)=>{const r=f.getBoundingClientRect();const{min,max}=geo();
    const y=clamp(cy-r.top-cap.clientHeight/2,min,max);const norm=1-(y-min)/(max-min);return clamp(Math.round((1-norm)*FMAX),0,FMAX);};
  const WIRE={mon:"set_monitor_volume",hp1:"set_hp1_volume",hp2:"set_hp2_volume"};
  f.addEventListener("pointerdown",e=>{f.setPointerCapture(e.pointerId);drag=true;fader[key].drag=true;
    const s=fromY(e.clientY);fader[key].step=s;f._place(s);wsSend({type:WIRE[key],step:s});e.preventDefault();});
  f.addEventListener("pointermove",e=>{if(!drag)return;const s=fromY(e.clientY);fader[key].step=s;f._place(s);wsSend({type:WIRE[key],step:s});});
  const end=()=>{drag=false;fader[key].drag=false;};
  f.addEventListener("pointerup",end); f.addEventListener("pointercancel",end);
});
// mute toggle
document.querySelector('[data-tog="mute"]').addEventListener("click",function(){
  const on=!this.classList.contains("on"); this.classList.toggle("on",on);
  wsSend({type:"set_monitor_mute",enabled:on});
});

// connection chip
function setConn(ok){
  const c=document.getElementById("conn"),t=document.getElementById("connTxt");
  c.classList.toggle("ok",ok); c.classList.toggle("off",!ok);
  t.textContent=ok?"ONLINE":"OFFLINE";
}

// incoming state
function onMsg(s){
  if(s.type!=="state_sync") return;
  applyChan(1,s.input1); applyChan(2,s.input2);
  if(s.outputs){
    applyFader("mon",s.outputs.monitor_step);
    applyFader("hp1",s.outputs.hp1_step);
    applyFader("hp2",s.outputs.hp2_step);
    const mt=document.getElementById("muteTag");
    const mb=document.querySelector('[data-tog="mute"]');
    if(mt) mt.textContent=s.outputs.monitor_mute?"MUTED":"";
    if(mb) mb.classList.toggle("on",!!s.outputs.monitor_mute);
  }
  if(s.meters){
    paintMeter("inL",s.meters.in_l_dbfs); paintMeter("inR",s.meters.in_r_dbfs);
    paintMeter("outL",s.meters.out_l_dbfs); paintMeter("outR",s.meters.out_r_dbfs);
    paintGR("comp",s.meters.comp_gr_db); paintGR("lim",s.meters.lim_gr_db);
    // channel input LEDs reuse the input meters
    setInLed(1,s.meters.in_l_dbfs); setInLed(2,s.meters.in_r_dbfs);
  }
}
function setInLed(n,dbfs){
  const i=document.querySelector(`[data-meter="${n}"]`); if(i) i.style.width=clamp((dbfs+60)/60*100,0,100)+"%";
}
function applyChan(n,c){
  if(!c) return;
  const m=modeKey(c.mode);
  if(m&&GAIN_RANGE[m]&&!ch[n].drag){ ch[n].mode=m; renderMode(n); }
  if(!ch[n].drag && typeof c.gain_db==="number"){
    const[lo,hi]=GAIN_RANGE[ch[n].mode]||[0,65];
    let db=c.gain_db; if(ch[n].mode==="line"&&db>127)db-=256;
    ch[n].db=clamp(db,lo,hi); renderGain(n);
  }
  const p=document.querySelector(`.chan[data-ch="${n}"]`);
  p.querySelector('[data-tog="48v"]').classList.toggle("on",!!c.phantom);
  p.querySelector('[data-tog="phase"]').classList.toggle("on",!!c.phase_invert);
}
function applyFader(key,step){
  if(typeof step!=="number"||fader[key].drag) return;
  fader[key].step=clamp(step,0,FMAX); const f=document.querySelector(`[data-fader="${key}"]`); if(f&&f._place)f._place(fader[key].step);
}

// init
renderMode(1);renderMode(2);renderGain(1);renderGain(2);
document.querySelectorAll("[data-fader]").forEach(f=>f._place(0));
setConn(false);
connect();
window.addEventListener("resize",()=>{for(const k in fader){const f=document.querySelector(`[data-fader="${k}"]`);if(f&&f._place)f._place(fader[k].step);}});
</script>
</body>
